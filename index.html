<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeSavingsQuotes — Free local solar quotes in about a minute</title>
    <meta name="description" content="Compare free quotes from up to 3 trusted local solar installers. No door-knocks, no pressure. $0-down financing available." />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18156427728"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18156427728');
    </script>

    <!-- Jornaya LeadiD -->
    <script id="LeadiDscript" type="text/javascript">
      (function() {
        var s = document.createElement('script');
        s.id = 'LeadiDscript_campaign';
        s.type = 'text/javascript';
        s.async = true;
        s.src = '//create.lidstatic.com/campaign/8b5c4cca-4d4b-3042-ddaf-e932a53d619c.js?snippet_version=2';
        var LeadiDscript = document.getElementById('LeadiDscript');
        LeadiDscript.parentNode.insertBefore(s, LeadiDscript);
      })();
    </script>

    <!-- TrustedForm -->
    <script type="text/javascript">
      (function() {
        var tf = document.createElement('script');
        tf.type = 'text/javascript';
        tf.async = true;
        tf.src = ("https:" == document.location.protocol ? 'https' : 'http') +
          '://api.trustedform.com/trustedform.js?field=xxTrustedFormCertUrl&use_tagged_consent=true&l=' +
          new Date().getTime() + Math.random();
        var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(tf, s);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Jornaya / TrustedForm no-JavaScript fallbacks -->
    <noscript><img src='//create.leadid.com/noscript.gif?lac=F2DCEEA5-FE76-2DE2-9848-7725157C27F2&lck=8b5c4cca-4d4b-3042-ddaf-e932a53d619c&snippet_version=2' /></noscript>
    <noscript><img src='https://api.trustedform.com/ns.gif' /></noscript>

    <!--
      Persistent lead-certificate fields. These exist from initial page load so
      the Jornaya (#leadid_token) and TrustedForm (xxTrustedFormCertUrl) scripts
      can bind to a real <form> and populate them throughout the session — not
      just on the final funnel step. Positioned off-screen (not display:none, so
      the scripts still treat the form as active). Read at submit in submitQuote.
    -->
    <form id="lead-cert-fields" aria-hidden="true" tabindex="-1"
          style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"
          onsubmit="return false">
      <input type="hidden" id="leadid_token" name="universal_leadid" value="" />
      <input type="hidden" id="xxTrustedFormCertUrl" name="xxTrustedFormCertUrl" value="" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
